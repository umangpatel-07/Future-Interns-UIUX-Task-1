<text x="42" y="905" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#68758A">Understand options, timing and cost.</text>
<rect x="22" y="960" width="346" height="105" rx="14" fill="#FFFFFF" stroke="#E7EBF2" stroke-width="1"/>
<text x="42" y="997" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#087E8B">03  Treatment &amp; care</text>
<text x="42" y="1030" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#68758A">Follow your plan with clear aftercare.</text>
