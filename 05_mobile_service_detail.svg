<text x="42" y="747" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#087E8B">01  Consultation</text>
<text x="42" y="780" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#68758A">Discuss your goals and oral health.</text>
